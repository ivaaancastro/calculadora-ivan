name: Update snapshots

# Regenera las capturas visuales de una rama con la imagen de Playwright del CI (sin Docker local)
# y las commitea en esa misma rama. Lanzar a mano: Actions → Update snapshots → Run workflow.
#
# Secreto opcional SNAPSHOT_PUSH_TOKEN (PAT con permiso «Contents: write» sobre este repo): sin él
# el push usa GITHUB_TOKEN y GitHub NO lanza el CI sobre ese commit (hay que relanzarlo a mano).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama del PR (nunca main ni develop)'
        required: true
      specs:
        description: 'Specs a regenerar, separadas por espacios (vacío = las tres visuales)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.v.outputs.version }}
    steps:
      - name: Rama permitida
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in main|develop|refs/*|'') echo "❌ Rama no permitida: $BRANCH"; exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - id: v
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  update:
    runs-on: ubuntu-latest
    needs: guard
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.guard.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.SNAPSHOT_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - name: Regenerar capturas cambiadas
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          SPECS="${SPECS:-e2e/visual.spec.js e2e/visual-v2.spec.js e2e/access-visual-v2.spec.js}"
          # shellcheck disable=SC2086
          npx playwright test $SPECS --update-snapshots=changed --workers=4 --retries=0 --reporter=dot
      - name: Commit y push (solo e2e/__screenshots__)
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "Sin cambios en las capturas."; exit 0; fi
          git diff --cached --stat | tail -5
          git commit -m "test(e2e): regenerar capturas visuales (workflow update-snapshots)"
          git push origin "HEAD:refs/heads/$BRANCH"
