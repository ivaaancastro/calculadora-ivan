name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Check loose colors (tokens ratchet)
        run: npm run lint:colors
      - name: Check UI primitives (usage, retired classes, className)
        run: npm run lint:ui

  validate-specs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate specs exist and are well-formed
        run: |
          if [ ! -d docs/specs ]; then
            echo "❌ Falta carpeta docs/specs"
            exit 1
          fi
          if [ ! -f MEMORY ]; then
            echo "❌ Falta archivo MEMORY"
            exit 1
          fi
          if [ ! -f AGENTS ]; then
            echo "❌ Falta archivo AGENTS"
            exit 1
          fi
          echo "✅ Estructura SDD validada"

  test:
    runs-on: ubuntu-latest
    needs: [lint, validate-specs]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Imagen oficial de Playwright (Ubuntu): las capturas de referencia se generan
    # con la misma imagen (npm run test:e2e:update), así que son comparables.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright E2E Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Build
        run: npm run build
