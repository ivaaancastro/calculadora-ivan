name: CI

# CI rápido (spec-capa6-v2-premium, RF-A1): dos jobs en paralelo y sin capturas.
# Objetivo: menos de 5 minutos por PR.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run lint:colors
      - run: npm run lint:ui
      - run: npm run lint:motion
      - name: La imagen de Playwright del job e2e coincide con package.json
        run: |
          v="$(node -p "require('@playwright/test/package.json').version")"
          grep -q "playwright:v${v}-noble" .github/workflows/ci.yml || {
            echo "❌ La imagen de Playwright de ci.yml no es v${v}-noble (la de package.json)"; exit 1; }
      - run: npx vitest run --reporter=dot
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
