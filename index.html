<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Dashboard de rendimiento deportivo: métricas de entrenamiento, PMC, zonas de potencia, calendario y salud." />

  <!-- Redes sociales (sin og:image: aún no hay imagen de marca) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Forma" />
  <meta property="og:title" content="Forma — tu rendimiento deportivo, en un panel" />
  <meta property="og:description"
    content="Analiza tus actividades, sigue tu forma y tu carga de entrenamiento y planifica con datos." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Forma — tu rendimiento deportivo, en un panel" />
  <meta name="twitter:description"
    content="Analiza tus actividades, sigue tu forma y tu carga de entrenamiento y planifica con datos." />

  <!-- PWA Settings for iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Forma" />
  <meta name="theme-color" content="#f2f2f7" />
  <script>
    // Primera pintura: misma lectura que src/hooks/useTheme.js; los colores son --canvas de tokens.css.
    (function () {
      var stored = null;
      var systemDark = false;
      try { stored = localStorage.getItem('theme'); } catch (e) { /* sin almacenamiento */ }
      try { systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { /* sin matchMedia */ }
      var dark = stored === 'dark' || (stored !== 'light' && systemDark);
      document.documentElement.classList.toggle('dark', dark);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f2f2f7');
    })();
  </script>


  <!-- Google Fonts: Inter (preloaded for faster FCP) y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet">
  </noscript>
  <!-- JetBrains Mono (D8): metadatos y cifras secundarias, solo 400 y 500 -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">

  <title>Forma</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
